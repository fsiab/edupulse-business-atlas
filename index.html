21", "exchange": "KPI evidence and exceptions", "custody": "Head office", "payment": "No separate charge", "basis": "Defined KPI formula", "risk": "Misleading comparison", "proof": "Source-linked KPI"}, {"from": "8", "to": "1", "name": "Financial reporting", "feature": "F31", "exchange": "Ledger and capacity information", "custody": "Finance", "payment": "No separate charge", "basis": "Accounting policy", "risk": "Incorrect margin", "proof": "Reconciled ledger"}, {"from": "10", "to": "1", "name": "Standards and reporting", "feature": "F08", "exchange": "Curriculum / reporting requirements", "custody": "School leadership", "payment": "School → authority if applicable", "basis": "Applicable rules", "risk": "Noncompliance", "proof": "Official requirements"}, {"from": "1", "to": "12", "name": "Platform procurement", "feature": "F35", "exchange": "Contract and configuration", "custody": "EduPulse / school", "payment": "School → EduPulse", "basis": "Negotiated subscription", "risk": "Failed implementation", "proof": "Contract and acceptance"}, {"from": "12", "to": "11", "name": "Integration delivery", "feature": "F35", "exchange": "API requests and receipts", "custody": "Authorized provider", "payment": "EduPulse or school → provider", "basis": "Service agreement", "risk": "Data leakage / outage", "proof": "Integration logs"}, {"from": "4", "to": "3", "name": "Teacher development review", "feature": "F22", "exchange": "Teaching records and context", "custody": "Section head / HR", "payment": "School payroll", "basis": "Fair review policy", "risk": "Biased rating", "proof": "Human-reviewed evidence"}, {"from": "5", "to": "6", "name": "Progress discussion", "feature": "F12", "exchange": "Child learning record", "custody": "School-authorized family access", "payment": "No separate charge", "basis": "Guardian access policy", "risk": "Exposure of other pupils", "proof": "Access audit"}, {"from": "12", "to": "1", "name": "Benchmark report", "feature": "F32", "exchange": "Aggregated peer metrics", "custody": "EduPulse data steward", "payment": "Potential module fee", "basis": "Opt-in, suppression thresholds", "risk": "Re-identification", "proof": "Aggregate methodology"}]};const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let mode='Map',role='All',query='',selected='ROOT',depth='1',direction='Both';const tabs=['Map','Handoffs','Features','Data','Journeys','Parent','School','Teacher','Student','Economics','Engineering'];const nodes=[{id:'ROOT',name:'EduPulse',type:'Core'},...D.foundations.map(a=>({...a,type:'Foundation'})),...D.business.map(a=>({...a,type:'Business'})),...D.features.map(a=>({...a,type:'Feature'})),...D.actors.map((a,i)=>({id:'A'+(i+1),name:a[0],type:'Stakeholder',desc:a[1],data:a[2],payment:a[3],metric:a[4]})),...D.sources.map(a=>({...a,type:'Data'}))];const N=Object.fromEntries(nodes.map(n=>[n.id,n]));const edges=[];function edge(a,b,t){if(N[a]&&N[b])edges.push({a,b,t})}D.foundations.forEach(t=>{edge('ROOT',t.id,'foundation');t.features.forEach(f=>edge(t.id,f,'enables'))});D.business.forEach(b=>{edge('ROOT',b.id,'business model');b.features.forEach(f=>edge(b.id,f,'includes'))});const actorRoles={School:[1,2,3,7,8,9,10,11,12],Teacher:[4],Parent:[6],Student:[5]};D.features.forEach(f=>{f.roles.forEach(r=>{const ids=actorRoles[r];(r==='School'?[2]:ids).forEach(i=>edge('A'+i,f.id,'uses / benefits'))});f.p.forEach(d=>edge(d,f.id,'primary evidence'));f.s.forEach(d=>edge(d,f.id,'secondary evidence'))});D.handoffs.forEach(h=>{edge('A'+h.from,'A'+h.to,h.name);edge('A'+h.from,h.feature,'handoff initiator');edge(h.feature,'A'+h.to,'handoff recipient')});const colors={Core:'#e4eef5',Foundation:'#a4a9ff',Business:'#f4bc73',Feature:'#65d5bf',Stakeholder:'#78aef5',Data:'#d0a4ee'};function chip(id){return N[id]?`<button class="chip" onclick="focusNode('${id}')">${esc(N[id].name)}</button>`:''}function focusNode(id){selected=id;mode='Map';query='';render()}function change(t){mode=t;query='';if(['Parent','School','Teacher','Student'].includes(t))role=t;else role='All';render()}function stats(){ $('#stats').innerHTML=[['Businesses',D.business.length],['Stakeholders',D.actors.length],['Capabilities',D.features.length],['Data domains',D.sources.length],['Handoffs',D.handoffs.length],['SQL fields',D.dictionary.length]].map(([a,b])=>`<div class="stat"><b>${b}</b>${a}</div>`).join('') }function matches(a){return JSON.stringify(a).toLowerCase().includes(query.toLowerCase())}function searchBox(){return `<input aria-label="Search" placeholder="Search names, evidence, fields…" value="${esc(query)}" oninput="query=this.value;refresh()">`}function refresh(){let pos=document.activeElement.selectionStart;render();let el=$('.toolbar input');if(el){el.focus();el.setSelectionRange(pos,pos)}}function toolbar(extra=''){return `<div class="toolbar">${searchBox()}${extra}</div>`}function detail(id){let n=N[id];if(!n)return '';let h=`<small>${esc(n.type)} · ${esc(id)}</small><h2>${esc(n.name)}</h2>`;for(let [k,v] of Object.entries(n)){if(['id','type','name','p','s','features','roles'].includes(k))continue;h+=`<h3>${esc(({desc:'Purpose',model:'Proposed revenue model',guard:'Governance',grain:'Data grain',fields:'Data points',primary:'Authoritative source',secondary:'Supporting source',status:'Delivery status',output:'Decision / output',owner:'Accountable owner',kpi:'Success measure'})[k]||k)}</h3><p>${esc(v)}</p>`}if(n.p)h+=`<h3>Primary inputs</h3>${n.p.map(chip).join('')}<h3>Secondary inputs</h3>${n.s.map(chip).join('')}`;if(n.features)h+=`<h3>Capabilities</h3>${n.features.map(chip).join('')}`;if(n.type==='Data'){let s=D.sqlmap.find(a=>a.domain===id);h+=`<h3>SQL tables</h3><p>${esc(s?.tables||'Not mapped')}</p>`}if(n.type==='Feature'){let f=D.featuremap.find(a=>a.feature===id);h+=`<h3>SQL implementation</h3><p>${esc(f?.input_tables)}<br>${esc(f?.support_tables)}<br>${esc(f?.implementation)}</p>`}let e=edges.filter(e=>e.a===id||e.b===id);h+=`<h3>Connected relationships (${e.length})</h3><div class="list">${e.map(e=>`<div class="item" onclick="focusNode('${e.a===id?e.b:e.a}')">${esc(N[e.a].name)} → ${esc(N[e.b].name)}<br><small>${esc(e.t)}</small></div>`).join('')}</div>`;return h}
function graph(){let types=['Foundation','Business','Feature','Stakeholder','Data'],radii=[66,125,204,278,345],positions={ROOT:[400,400]};types.forEach((t,i)=>{let ns=nodes.filter(n=>n.type===t);ns.forEach((n,j)=>{let a=2*Math.PI*j/ns.length-Math.PI/2;positions[n.id]=[400+Math.cos(a)*radii[i],400+Math.sin(a)*radii[i]]})});let visible=new Set([selected]);if(selected==='ROOT'&&!query){nodes.forEach(n=>visible.add(n.id))}else if(query){nodes.filter(matches).forEach(n=>visible.add(n.id))}else{for(let i=0;i<Number(depth);i++){let old=new Set(visible);edges.forEach(e=>{if(old.has(e.a)&&direction!=='Upstream')visible.add(e.b);if(old.has(e.b)&&direction!=='Downstream')visible.add(e.a)})}}if(role!=='All'){let fs=new Set(D.features.filter(f=>f.roles.includes(role)).map(f=>f.id));let keep=new Set(['ROOT',...fs,...actorRoles[role].map(i=>'A'+i)]);edges.forEach(e=>{if(fs.has(e.a))keep.add(e.b);if(fs.has(e.b))keep.add(e.a)});visible=new Set([...visible].filter(i=>keep.has(i)))}let all=selected==='ROOT'&&!query&&role==='All';let rings=radii.map(r=>`<circle cx="400" cy="400" r="${r}" fill="none" stroke="#294158" stroke-dasharray="4 5"/>`).join('');let lines=edges.filter(e=>visible.has(e.a)&&visible.has(e.b)&&(!all||['business model','foundation','includes','uses / benefits'].includes(e.t))).map(e=>{let a=positions[e.a],b=positions[e.b];return `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${e.t==='primary evidence'?'#65d5bf':e.t==='secondary evidence'?'#d0a4ee':'#57768f'}" stroke-opacity="${all?.14:.45}" stroke-width="${e.a===selected||e.b===selected?1.8:.7}" ${e.t==='secondary evidence'?'stroke-dasharray="3 3"':''}/>`}).join('');let dots=nodes.map(n=>{let [a,b]=positions[n.id],on=visible.has(n.id),label=n.id==='ROOT'||n.type==='Foundation'||n.type==='Business'||n.type==='Stakeholder'||!all&&on;return `<g class="node" role="button" tabindex="0" aria-label="${esc(n.name)}" onclick="focusNode('${n.id}')" onkeydown="if(event.key==='Enter')focusNode('${n.id}')" opacity="${on?1:.12}"><title>${esc(n.name)}</title><circle cx="${a}" cy="${b}" r="${n.id==='ROOT'?16:n.id===selected?9:5.8}" fill="${colors[n.type]}" stroke="${n.id===selected?'white':'#0b1523'}" stroke-width="${n.id===selected?3:1}"/>${label?`<text x="${a}" y="${b-10}" text-anchor="middle" stroke="#0b1523" stroke-width="2.5" paint-order="stroke">${esc(n.name.length>27?n.name.slice(0,25)+'…':n.name)}</text>`:''}</g>`}).join('');return `<div class="graph"><svg viewBox="0 0 800 800" aria-label="Interactive concentric ecosystem graph">${rings}${lines}${dots}</svg></div>`}
function map(){return toolbar(`<select aria-label="Ecosystem" onchange="role=this.value;render()">${['All','Parent','School','Teacher','Student'].map(r=>`<option ${r===role?'selected':''}>${r}</option>`).join('')}</select><select aria-label="Direction" onchange="direction=this.value;render()">${['Both','Upstream','Downstream'].map(r=>`<option ${r===direction?'selected':''}>${r}</option>`).join('')}</select><select aria-label="Depth" onchange="depth=this.value;render()"><option value="1" ${depth==='1'?'selected':''}>1 hop</option><option value="2" ${depth==='2'?'selected':''}>2 hops</option></select><button onclick="selected='ROOT';query='';role='All';render()">Reset</button>`)+`<div class="layout"><div class="panel"><div class="legend">${Object.entries(colors).map(([k,v])=>`<span style="color:${v}">● ${k}</span>`).join('')}</div><small>Choose a node to trace dependencies. Upstream = incoming relationships; downstream = outgoing. Data edges point from source to feature.</small>${graph()}</div><div class="panel">${detail(selected)}<h3>Find a node</h3><div class="list">${nodes.filter(matches).map(n=>`<div class="item" onclick="focusNode('${n.id}')">${esc(n.name)} <small>· ${n.type}</small></div>`).join('')}</div></div></div>`}
function cards(arr,fn){return `<div class="grid">${arr.filter(matches).map(fn).join('')}</div>`}function table(arr){if(!arr.length)return '<p>No matches.</p>';let keys=Object.keys(arr[0]);return `<div class="scroll"><table><thead><tr>${keys.map(k=>`<th>${esc(k)}</th>`).join('')}</tr></thead><tbody>${arr.filter(matches).map(a=>`<tr>${keys.map(k=>`<td>${esc(a[k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}function handoffs(){return toolbar()+cards(D.handoffs,h=>`<article class="panel"><small>${esc(N['A'+h.from].name)} → ${esc(N['A'+h.to].name)}</small><h2>${esc(h.name)}</h2>${chip(h.feature)}${Object.entries(h).filter(([k])=>!['from','to','name','feature'].includes(k)).map(([k,v])=>`<h3>${esc(k)}</h3><p>${esc(v)}</p>`).join('')}</article>`)}function features(){return toolbar()+cards(D.features,f=>`<article class="panel"><small>${f.id} · ${esc(f.status)}</small><h2>${esc(f.name)}</h2><p>${esc(f.output)}<br>Owner: ${esc(f.owner)}<br>KPI: ${esc(f.kpi)}</p><h3>Primary</h3>${f.p.map(chip).join('')}<h3>Secondary</h3>${f.s.map(chip).join('')}${chip(f.id)}</article>`)}function data(){return toolbar()+cards(D.sources,s=>`<article class="panel"><small>${s.id} · ${esc(s.grain)}</small><h2>${esc(s.name)}</h2><h3>Primary source</h3><p>${esc(s.primary)}</p><h3>Secondary source</h3><p>${esc(s.secondary)}</p><h3>Fields</h3><p>${esc(s.fields)}</p><h3>Guardrail</h3><p>${esc(s.guard)}</p><h3>Primary for</h3>${D.features.filter(f=>f.p.includes(s.id)).map(f=>chip(f.id)).join('')}<h3>Secondary for</h3>${D.features.filter(f=>f.s.includes(s.id)).map(f=>chip(f.id)).join('')}${chip(s.id)}</article>`)}function ecosystem(r){let a=D.roles[r],ids=actorRoles[r],fs=D.features.filter(f=>f.roles.includes(r));return `<div class="panel"><h2>${r} ecosystem</h2><p>${esc(a.goal)}</p><div class="grid">${a.journey.map((j,i)=>`<div class="panel"><small>Journey ${i+1}</small><h3>${esc(j)}</h3></div>`).join('')}</div><h3>Value exchange</h3><p>${esc(a.value)}</p><h3>Economics</h3><p>${esc(a.economics)}</p><h3>Risks</h3><p>${esc(a.risk)}</p><button onclick="mode='Map';role='${r}';selected='ROOT';render()">Explore relationship map</button></div><h2 style="margin-top:18px">Capabilities</h2>${toolbar()}${cards(fs,f=>`<article class="panel"><h3>${esc(f.name)}</h3><p>${esc(f.output)}</p>${chip(f.id)}</article>`)}<h2 style="margin-top:18px">Stakeholder handoffs</h2>${cards(D.handoffs.filter(h=>ids.includes(+h.from)||ids.includes(+h.to)),h=>`<article class="panel"><h3>${esc(h.name)}</h3><p>${esc(N['A'+h.from].name)} → ${esc(N['A'+h.to].name)}<br>${esc(h.exchange)}<br>${esc(h.payment)}</p>${chip(h.feature)}</article>`)}`}
let picks=new Set(['B01','B02']);let econ={schools:2,students:1000,price:2,implementation:300,infra:150,support:500,module:100,attach:50,setup:1000};function economics(){let b=D.business.filter(b=>picks.has(b.id)),all=b.flatMap(a=>a.features),common=[...new Set(all)].filter(f=>all.filter(x=>x===f).length>1),unique=[...new Set(all)].filter(f=>!common.includes(f));return `<div class="notice">Illustrative USD scenario only. Business choices show shared capabilities, not independently verified market opportunities. Core subscription counted once; module assumptions are aggregate, not per selected business.</div><h2 style="margin-top:15px">Select business models</h2><div class="grid">${D.business.map(b=>`<label class="panel"><input type="checkbox" ${picks.has(b.id)?'checked':''} onchange="this.checked?picks.add('${b.id}'):picks.delete('${b.id}');render()"> ${esc(b.name)}<p>${esc(b.model)}</p></label>`).join('')}</div><div class="layout"><div class="panel"><h2>Shared capability dependencies</h2>${common.map(chip).join('')||'<p>Select overlapping businesses.</p>'}<h3>Unique across selected businesses</h3>${unique.map(chip).join('')}<h3>Shared cost base</h3><p>Identity, hosting, support, security, workflow engine and onboarding. Allocate once; avoid double counting.</p><h3>Incremental drivers</h3><p>Advanced analytics, partner API fees, training, content licensing and additional support. Validate per module.</p></div><div class="panel"><h2>Editable pilot economics</h2>${Object.entries({schools:'Schools',students:'Total students',price:'Monthly USD / student',implementation:'One-time fee / school',infra:'Monthly infrastructure',support:'Monthly support & operations',module:'Monthly module fee / adopting school',attach:'Module adoption %',setup:'One-time deployment cost'}).map(([k,l])=>`<label>${l}<input type="number" min="0" ${k==='attach'?'max="100"':''} step="any" value="${econ[k]}" onchange="econ.${k}=Math.max(0,${k==='attach'?'Math.min(100,+this.value)':' +this.value'});render()"></label>`).join('')}<div id="calc"></div>${calc()}</div></div>`}function calc(){let m=econ.students*econ.price+econ.schools*econ.module*econ.attach/100,c=econ.infra+econ.support,o=econ.schools*econ.implementation-econ.setup;return `<h3>Monthly revenue</h3><div class="money">$${m.toFixed(0)}</div><h3>Monthly contribution before other costs</h3><div class="money">$${(m-c).toFixed(0)}</div><h3>Year-one illustrative contribution</h3><div class="money">$${(12*(m-c)+o).toFixed(0)}</div><p>Excludes acquisition, product development, taxes, payment/WhatsApp/AI usage and unmodeled overhead. Not EBITDA.</p>`}function render(){ $('#nav').innerHTML=tabs.map(t=>`<button class="${mode===t?'active':''}" onclick="change('${t}')">${t}</button>`).join('');let content=mode==='Map'?map():mode==='Handoffs'?handoffs():mode==='Features'?features():mode==='Data'?data():mode==='Journeys'?toolbar()+`<div class="panel">${table(D.journeys)}</div>`:mode==='Economics'?economics():mode==='Engineering'?toolbar()+`<div class="notice">Engineering V1 source snapshot. PostgreSQL execution, RLS and end-to-end workflow tests are not verified.</div><h2>Data dictionary</h2><div class="panel">${table(D.dictionary)}</div><h2>Event registry</h2><div class="panel">${table(D.events)}</div>`:ecosystem(mode);$('#app').innerHTML=content}stats();render();</script></html>
